table:
  name: users
  schema: public
array_relationships:
  - name: posts
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: posts
          schema: public
  - name: comments
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: comments
          schema: public
select_permissions:
  - role: public
    permission:
      columns: [id, name, username, email, bio, created_at]
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: public
    permission:
      check: {}
      columns: [name, username, email, bio]
update_permissions:
  - role: public
    permission:
      columns: [name, username, email, bio]
      filter: {}
      check: {}
delete_permissions:
  - role: public
    permission:
      filter: {}
